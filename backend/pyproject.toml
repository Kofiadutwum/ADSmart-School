[project]
name = "adsmartschool-backend"
version = "1.0.0"
description = "ADsmartschool: the Django API behind every school website and portal."
requires-python = ">=3.14"
# Keep in step with requirements.txt (tests/test_packaging.py checks it).
dependencies = [
    "Django==6.1.2",
    "argon2-cffi==25.1.0",
    "djangorestframework==3.18.3",
    "django-environ==0.14.0",
    "phonenumbers==9.0.41",
    "Pillow==12.3.0",
    "tzdata==2026.5",
    "psycopg[binary]==3.3.6",
    "cloudinary==1.46.3",
    "gunicorn==26.2.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# Cache keys must be safe for any cache backend: never put raw user input in them.
filterwarnings = ["error::django.core.cache.backends.base.CacheKeyWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
